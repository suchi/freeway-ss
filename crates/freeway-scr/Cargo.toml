[package]
name = "freeway-scr"
description = "Windows screensaver host for Night Freeway SS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# For checking the UFO on a real screen: visits come every 20 seconds on average
# instead of every 10 minutes. Never enabled for releases.
ufo-demo = []

[dependencies]
freeway-core = { path = "../freeway-core" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3.1"

[build-dependencies]
embed-resource = "3.0.12"
