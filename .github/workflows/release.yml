name: Release

# Why: pushing a tag vX.Y.Z publishes the tagged commit as a release. Manual
# dispatch re-runs the release of an existing tag (for example after a failed
# run). The build job only has a read-only token, and the publish job runs no
# code from this repository or its dependencies, so a compromised build
# dependency cannot get a token that writes to the repository.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # Pinned rather than windows-latest so that a release is built on a known image.
    runs-on: windows-2025
    steps:
      - name: Validate tag
        shell: pwsh
        run: |
          if ($env:TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+\z') {
            throw "Invalid tag name (expected vMAJOR.MINOR.PATCH)."
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "$env:TAG is not on main." }
      - name: Install toolchain
        run: rustup toolchain install
      - name: Build and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($target in 'x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc') {
            cargo xtask dist --target $target
            if ($LASTEXITCODE -ne 0) { throw "cargo xtask dist failed for $target" }
          }
          # The zip names come from the workspace version in Cargo.toml, so
          # this also checks that the version matches the tag.
          foreach ($arch in 'x64', 'arm64') {
            $zip = "target/dist/NightFreewaySS-$env:TAG-win-$arch.zip"
            if (-not (Test-Path $zip)) { throw "$zip is missing: does Cargo.toml have the version of $env:TAG?" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            target/dist/*.zip
            target/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "Night Freeway SS $TAG" --generate-notes)
          # Versions before 1.0.0 were the phase releases, published as pre-releases.
          if [[ "$TAG" == v0.* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" dist/*
